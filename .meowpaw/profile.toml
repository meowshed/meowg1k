# What this repository declares to the harness. Every value below comes from
# what the repository already does; a verb or a section it has no command or
# practice for is left out.

# Each verb is a mise task, because mise owns the toolchain and the tasks here
# and `mise run all` is the gate CI mirrors. The `check` verb runs the
# `typecheck` task, which sits outside `all` because clippy under the `lint`
# verb, the `check` task, already type-checks every target.
[verbs]
format = "mise run fmt-check"
lint = "mise run check"
check = "mise run typecheck"
test = "mise run test"
build = "mise run build"

# Conventional commits, enforced by the conventional-pre-commit hook. Every
# commit on the trunk follows the format, keeps its subject within 72
# characters and carries a Signed-off-by trailer.
[commits]
subject_limit = 72
trailers = ["Signed-off-by"]

# The types the history uses, and how far each moves the version when a
# release happens. CHANGELOG.md follows semantic versioning, so a feature bumps
# the minor version, a fix the patch, and the rest nothing. No type starts a
# release: a release happens only when the owner approves it.
[commits.types]
feat = "minor"
fix = "patch"
build = "none"
docs = "none"
ci = "none"
chore = "none"
refactor = "none"
spec = "none"
test = "none"

# main is the only long-lived branch and every change lands by squash merge.
# Every commit on the trunk carries a signature, and commit.gpgsign is on.
[git]
trunk = "main"
require_signatures = true

# The record: vision.md, requirements/, adrs/ and specs/ under project/.
[record]
root = "project"

# /plan decomposes a spec into GitHub issues, and pull requests close them.
[tracker]
kind = "github"
